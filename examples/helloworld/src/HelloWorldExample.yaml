vendor:
   name: Arista Networks
   address: 5453 Great America Parkway, Santa Clara, CA 95054
   phoneNumber: +1-408-547-5500
   email: fdk-support@arista.com

namespace: arista.helloworld

daemons:
   HelloWorldExampleDaemon:
      exe: /opt/apps/helloworld/HelloWorldExampleDaemon.py

modes:
   "helloworld":
      command:
         syntax: "helloworld"
         noSyntax: "helloworld"
      modeKey: "helloworld"
      daemon: HelloWorldExampleDaemon

commands:
   disabled:
      syntax: disabled
      noSyntax: disabled
      mode: "helloworld"

   # Show a user-friendly version of the helloworld status
   show_helloworld_status:
      syntax: show helloworld status
      mode: Unprivileged
      outputSchema: {}
